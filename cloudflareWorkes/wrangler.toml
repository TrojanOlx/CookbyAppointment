# Cloudflare Workers deployment config for the CookbyAppointment API.
# Before deploying, confirm the local worker.js matches the code currently
# running in Cloudflare's dashboard quick editor.

name = "black-frost-08dc"
main = "worker.js"
compatibility_date = "2026-08-17"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# Keep variables/secrets that already exist in the Cloudflare dashboard
# such as WX_APPID and WX_SECRET.
keep_vars = true

routes = [
  { pattern = "wx.oulongxing.com", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "cookby_appointment"
database_id = "07358a9d-1108-41be-9b00-01fbc2b5e922"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILE_BUCKET"
bucket_name = "cookby-appointment"

[vars]
FAMILY_MODE = "on"
DEFAULT_TIMEZONE = "Asia/Shanghai"
FAMILY_MEMBER_LIMIT = "20"
INVITE_TTL_HOURS = "72"
MAX_UPLOAD_BYTES = "5242880"
FAMILY_STORAGE_QUOTA_BYTES = "209715200"
R2_PUBLIC_URL = "https://images.wx.oulongxing.com"
MINIPROGRAM_VERSION = "1.0.2"
MINIPROGRAM_MIN_VERSION = "1.0.1"
MINIPROGRAM_UPDATE_MESSAGE = "小程序已有新版本，请移除最近使用后重新打开。"
TMPL_APPOINTMENT = "7-mOlcEKprjQzibpS0P8q9Buyz4zA0cgm4W3DcWZVqM"
TMPL_NEW_APPT = "T1TUgP2VEEzz_3lAAypK1sP4AyJ_YIpSsX_hy1tU2is"
TMPL_CONFIRMED = "7-mOlcEKprjQzibpS0P8q9Buyz4zA0cgm4W3DcWZVqM"
TMPL_CANCELLED = "7-mOlcEKprjQzibpS0P8q9Buyz4zA0cgm4W3DcWZVqM"
TMPL_COMPLETED = "7-mOlcEKprjQzibpS0P8q9Buyz4zA0cgm4W3DcWZVqM"
TMPL_REMINDER = "_EAlByNCdkJmmWr-UjT8sSaY5mmbTPcdqmSIAYO3bPQ"

[observability]
enabled = true
head_sampling_rate = 1

# Cron Trigger：UTC 00:00 = 北京时间 08:00，每天自动发送当日预约提醒
[triggers]
crons = ["0 0 * * *"]
